# Railway build config for the combined FastAPI backend + React (Vite)
# frontend. Requires this service's Root Directory to be the repository
# root, not backend/ -- Railway's build only sees files inside its
# configured root, and frontend/ is a sibling of backend/, not nested
# inside it. If this service is currently scoped to backend/ only, this
# file won't be picked up at all until that's changed in Railway's
# dashboard (Settings -> Root Directory).
#
# The frontend's build (vite@8 / rolldown) requires Node >=20.19 or
# >=22.12 -- it fails on older Node 20.x (confirmed locally against
# 20.11). nodejs_22 below is deliberately a recent LTS to clear that bar.

providers = ["python"]

[phases.setup]
nixPkgs = ["...", "nodejs_22"]

[phases.install]
cmds = [
  "cd backend && pip install -r requirements.txt",
  "cd frontend && npm ci",
]

[phases.build]
cmds = ["cd frontend && npm run build"]

[start]
cmd = "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
